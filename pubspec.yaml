name: wolfstockpro

description: WolfStock Pro - Multi-Branch Inventory and Stock Management System

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Security
  crypto: ^3.0.6

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Date & Number Formatting
  intl: ^0.20.2

  # Barcode Scanner
  mobile_scanner: ^7.0.0

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.14.2

  # Excel Export
  excel: ^4.0.6

  # Sharing
  share_plus: ^11.0.0

  # Product Images
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
